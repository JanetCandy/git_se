[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflux-sync"
version = "0.1.0"
description = "A lightweight asynchronous task synchronization and retry manager for Python."
readme = "README.md"
authors = [
    { name = "Developer", email = "your.email@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/your-username/pyflux-sync"
