<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Python App - 第9週作業</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            color: #333;
            background-color: #fcfcfc;
        }
        .card { 
            background: white;
            border: 1px solid #e1e4e8; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        h1 { color: #f6821f; margin-top: 0; }
        .btn-group {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        button { 
            background-color: #f6821f; 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #e06d10; }
        pre { 
            background: #f6f8fa; 
            padding: 15px; 
            border-radius: 6px; 
            border: 1px solid #eaecef;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Cloudflare Python 網站應用</h1>
        <p>這是第9週作業的靜態前端介面，能夠與後端的 Python Worker 進行非同步 API 互動。</p>
        
        <div class="btn-group">
            <button onclick="fetchApi('/api/hello')">測試 /api/hello</button>
            <button onclick="fetchApi('/api/info')">測試 /api/info</button>
        </div>

        <h3>API 回傳結果：</h3>
        <pre id="output">點擊上方按鈕以發送 API 請求...</pre>
    </div>

    <script>
        async function fetchApi(endpoint) {
            const outputEl = document.getElementById('output');
            outputEl.textContent = '載入中...';
            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                outputEl.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                outputEl.textContent = '請求失敗: ' + error.message;
            }
        }
    </script>
</body>
</html>
